<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corps for Progress — Website under construction</title>
<meta name="description" content="Corps for Progress : notre site est en construction.">
<link rel="icon" href="assets/cp-logo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0a1f44;
    --bg: #f5f8fc;
    --grad: linear-gradient(90deg, #1d63c4, #1fa9e6);
    --display: "Bricolage Grotesque", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--navy);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .logo { width: min(280px, 60vw); height: auto; display: block; }
  .contact {
    margin-top: 24px; font-family: var(--display); font-weight: 700; font-size: 18px;
    color: #1d63c4; text-underline-offset: 3px;
  }
  .contact:hover { color: #12427f; }
  .ticker {
    width: 100%; margin-top: 40px;
    background: var(--grad); color: #fff;
    overflow: hidden; white-space: nowrap; padding: 14px 0;
  }
  .ticker__track { display: inline-flex; animation: scroll 25s linear infinite; }
  .ticker__track span {
    font-family: var(--display); font-weight: 700; letter-spacing: .04em;
    font-size: clamp(16px, 2.2vw, 22px); text-transform: uppercase; padding: 0 2.5em;
  }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) {
    .ticker__track { animation: none; }
  }
</style>
</head>
<body>

<img class="logo" src="assets/cp-logo.jpeg" alt="Corps for Progress">
<div class="ticker" role="status" aria-label="Website under construction">
  <div class="ticker__track" aria-hidden="true">
    <span>Website under construction</span><span>Website under construction</span><span>Website under construction</span><span>Website under construction</span>
    <span>Website under construction</span><span>Website under construction</span><span>Website under construction</span><span>Website under construction</span>
  </div>
</div>
<a class="contact" href="contact.html">Contact</a>

</body>
</html>
