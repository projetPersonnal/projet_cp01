<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Corps for Progress</title>
<meta name="description" content="Contactez Corps for Progress : contact@cp-01.net">
<link rel="icon" href="assets/cp-logo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0a1f44;
    --blue: #1d63c4;
    --blue-deep: #12427f;
    --muted: #5d6a80;
    --bg: #f5f8fc;
    --display: "Bricolage Grotesque", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--navy);
    font-family: "DM Sans", sans-serif; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0 16px;
  }
  .logo { width: min(200px, 50vw); height: auto; display: block; margin-bottom: 32px; }
  h1 { font-family: var(--display); font-weight: 700; font-size: clamp(28px, 5vw, 40px); margin: 0 0 12px; }
  .email { font-size: clamp(18px, 3vw, 22px); font-weight: 500; color: var(--blue); text-underline-offset: 3px; word-break: break-all; }
  .email:hover { color: var(--blue-deep); }
  .back { margin-top: 40px; color: var(--muted); font-size: 15px; }
  .back:hover { color: var(--navy); }
</style>
</head>
<body>

<a href="index.html"><img class="logo" src="assets/cp-logo.jpeg" alt="Corps for Progress — Accueil"></a>

<h1>Contact</h1>
<a class="email" href="mailto:contact@cp-01.net">contact@cp-01.net</a>

</body>
</html>
